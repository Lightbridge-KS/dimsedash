<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DimseDash · Navigation options</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c22;--raised:#22262e;--text:#e2e2e9;--muted:#b9bec9;--line:#424750;--blue:#aac7ff;--bluebg:#284777;--buttontext:#102f60;--prod:#d8b9dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif}body.light{color-scheme:light;--bg:#f9f9ff;--panel:#eff0f7;--raised:#e5e7ef;--text:#191c20;--muted:#535c6b;--line:#c3c7d1;--blue:#415f91;--bluebg:#d6e3ff;--buttontext:white;--prod:#725578}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:transparent;color:inherit}button:hover:not(:disabled){background:var(--raised)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.primary{background:var(--blue);color:var(--buttontext);border-color:transparent}.primary:hover:not(:disabled){background:var(--blue);filter:brightness(.92)}.quiet{border-color:transparent;color:var(--blue)}.review{padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}.review strong{display:block}.review small,.muted{color:var(--muted)}.options{display:flex;gap:8px;flex-wrap:wrap}.options [aria-pressed=true]{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}.theme{margin-left:auto}.appbar{height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:650}.demo{font-size:12px;color:var(--muted)}.frame{display:flex;height:calc(100dvh - 158px);min-height:420px}.sidebar{width:205px;flex-shrink:0;background:var(--panel);padding:20px 16px;display:flex;flex-direction:column;overflow:auto}.nav{display:grid;gap:8px}.nav button{text-align:left;border:0;padding:12px}.nav .selected{color:var(--blue);background:var(--bluebg)}.receiver{margin-top:auto;padding:24px 8px 0}.receiver hr{border:0;border-top:1px solid var(--line);margin:0 0 16px}.receiver small{display:block;color:var(--muted)}.receiver .status{margin:12px 0 6px;display:flex;gap:8px;align-items:center}.content{flex:1;min-width:0;overflow:auto;padding:26px 32px}.content.focus{max-width:1280px;margin:0 auto;width:100%}h1{font-size:27px;font-weight:600;margin:0 0 6px}h2{font-size:18px;font-weight:550;margin:0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.intro{margin:0;color:var(--muted)}.toolbar{display:flex;gap:12px;margin:28px 0 10px;align-items:center}input{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;width:min(450px,100%)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;margin:18px 0;max-width:1100px}.card{text-align:left;padding:22px;min-height:204px;display:flex;flex-direction:column;gap:9px;border-radius:10px}.card strong{font-size:18px;font-weight:550}.server{color:var(--blue);font-size:25px}.card .endpoint{overflow-wrap:anywhere;color:var(--muted)}.card .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}.badge{display:inline-block;padding:3px 9px;border-radius:5px;background:var(--raised);font-size:12px}.production{color:var(--prod)}.back{margin:0 0 20px -12px}.identity{margin-top:10px;color:var(--muted)}details{margin:12px 0 22px;color:var(--muted)}summary{cursor:pointer;width:fit-content}details p{margin:8px 0}.ops{display:flex;gap:24px;margin:26px 0 20px;border-bottom:1px solid var(--line);padding-bottom:10px}.ops strong{color:var(--blue);border-bottom:3px solid var(--blue);padding-bottom:10px;margin-bottom:-11px}.ops span{color:var(--muted)}.notice{padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:0 0 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.evidence{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.tabs{display:flex;gap:28px;margin:20px 0;color:var(--muted)}.tabs strong{color:var(--blue)}.data{display:grid;grid-template-columns:145px 1fr;gap:10px;margin-top:16px}.data dt{color:var(--muted)}.data dd{margin:0;overflow-wrap:anywhere}.foot{color:var(--muted);font-size:13px;margin-top:24px}.focusReceiver{font-size:12px;color:var(--muted);margin:24px 0}.empty{padding:32px 0;color:var(--muted)}@media(max-width:900px){.review{padding:12px 16px}.frame{height:calc(100dvh - 182px)}.content{padding:22px}.sidebar{width:180px}.cards{grid-template-columns:1fr}.demo{max-width:280px;text-align:right}}@media(max-width:600px){.frame{height:auto}.sidebar{width:145px;padding:12px 6px}.content{padding:16px}.review{gap:8px}.data{grid-template-columns:1fr}.data dd{margin-bottom:8px}}
</style></head><body>
<div class="review"><div><strong>Navigation study · A approved</strong><small>Choose a layout, then open a node.</small></div><div class="options"><button id="optionA" aria-pressed="true">A · Nodes + sidebar</button><button id="optionB" aria-pressed="false">B · Focused workbench</button></div><button class="theme" id="theme">Light theme</button></div>
<header class="appbar"><span class="brand">DimseDash</span><span class="demo">INTERACTIVE DRAFT · Synthetic data · No network requests</span></header>
<div class="frame"><aside class="sidebar" id="sidebar"><nav class="nav"><button class="selected" id="home">▤ &nbsp; Nodes</button><button disabled>▱ &nbsp; Received files</button><button disabled>◷ &nbsp; History</button><button disabled>⚙ &nbsp; Settings</button></nav><div class="receiver"><hr><small>LOCAL RECEIVER</small><div>DIMSE_DASH</div><div>Port 11112</div><div class="status"><span aria-hidden="true">⊙</span> Stopped</div><small>Receiver unavailable in this build.</small></div></aside><main class="content" id="main"></main></div>
<script>
const nodes=[{id:'a',name:'Primary PACS',ae:'PACS_AET',host:'192.0.2.10:104',env:'Production'},{id:'b',name:'Research archive',ae:'RESEARCH_AET',host:'192.0.2.20:11112',env:'Test'},{id:'c',name:'Local test node',ae:'TEST_AET',host:'127.0.0.1:4242',env:'Test'}];
let option='A',page='library',selected=null,query='',run=null,origin='library',libraryScroll=0,focusCard=null;
const main=document.querySelector('#main');
function badge(n){return `<span class="badge ${n.env==='Production'?'production':''}">${n.env}</span>`}
function running(){return run&&run.state==='running'}
function notice(){if(!run)return '';return `<div class="notice"><span>${running()?'◉ Echo running':'Latest Echo'} · <strong>${run.node.name}</strong><span class="muted"> · simulation</span></span><button data-action="view">View run</button></div>`}
function render(){document.querySelector('#sidebar').hidden=option==='B'&&page!=='library';document.querySelector('#sidebar').style.display=option==='B'&&page!=='library'?'none':'flex';main.classList.toggle('focus',option==='B'&&page!=='library');document.querySelector('#home').innerHTML=`▤ &nbsp; ${option==='A'?'Nodes':'Workbench'}`;['A','B'].forEach(o=>document.querySelector('#option'+o).setAttribute('aria-pressed',String(option===o)));if(page==='library'){main.innerHTML=`${notice()}<div class="row between"><div><h1>DICOM nodes</h1><p class="intro">Choose a node to open its workbench.</p></div><button disabled title="Existing editor; outside this navigation draft">＋ Add node</button></div><div class="toolbar"><input id="search" aria-label="Search nodes" placeholder="Search nodes"></div><small class="muted">Cards · All environments · Name A–Z</small><div class="cards" id="cards"></div><p class="foot">Opening a node sends no traffic. Run an operation explicitly in its workbench.</p>`;document.querySelector('#search').value=query;document.querySelector('#search').oninput=e=>{query=e.target.value;renderCards()};renderCards();main.scrollTop=libraryScroll;}else if(page==='workspace'){const n=selected;main.innerHTML=`<button class="quiet back" data-action="back">← All nodes</button>${run&&run.node.id!==n.id?notice():''}<div class="row"><h1>${n.name}</h1>${badge(n)}</div><div class="identity">${n.ae} · ${n.host}<br>Calling AE · DIMSE_DASH</div><details><summary>Connection details</summary><p>Connect 30s · Association 30s · DIMSE 30s · Idle 60s</p></details><div class="ops"><strong>Echo</strong><span>Query · planned</span><span>Retrieve · planned</span></div><div class="row"><button class="primary" data-action="run" ${running()?'disabled':''}>▶ Run Echo demo</button>${running()&&run.node.id===n.id?'<button data-action="stop">Stop Echo demo</button>':''}</div><p class="foot">Echo success proves only the verification exchange.</p>${run&&run.node.id===n.id?evidence():`<div class="evidence"><h2>No retained Echo evidence for this node</h2><p class="muted">The app retains only the current/latest run detail.</p></div>`}${option==='B'?'<div class="focusReceiver">⊙ Local receiver · Stopped · DIMSE_DASH:11112 · Unavailable in this build</div>':''}`;main.scrollTop=0;}else{main.innerHTML=`<button class="quiet back" data-action="return">← Back</button><h1>Echo run · ${run.node.name}</h1><p class="intro">Frozen run evidence · Viewing this run does not change the next target.</p>${evidence()}${running()?'<button data-action="stop">Stop Echo demo</button>':''}${option==='B'?'<div class="focusReceiver">⊙ Local receiver · Stopped · Unavailable in this build</div>':''}`;main.scrollTop=0;}main.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action));}
function renderCards(){const found=nodes.filter(n=>[n.name,n.ae,n.host].some(s=>s.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));document.querySelector('#cards').innerHTML=found.length?found.map(n=>`<button class="card" id="card-${n.id}" data-node="${n.id}" aria-label="Open ${n.name} workbench"><span class="server" aria-hidden="true">▤</span><strong>${n.name}</strong><span class="endpoint">${n.ae}<br>${n.host}</span><span class="bottom">${badge(n)}<span class="muted">Open →</span></span></button>`).join(''):'<p class="empty">No matching nodes. Clear the search to see all nodes.</p>';main.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>{libraryScroll=main.scrollTop;focusCard=el.id;selected=nodes.find(n=>n.id===el.dataset.node);page='workspace';render();main.querySelector('.back').focus()});}
function evidence(){return `<section class="evidence"><h2>${running()?'Echo in progress':run.state==='stopped'?'Echo stopped':'Echo completed'} <span class="badge">Simulated</span></h2><div class="tabs"><strong>Summary</strong><span>Timeline</span><span>Negotiation</span><span>Trace</span></div><dl class="data"><dt>Executed target</dt><dd>${run.node.name} · ${run.node.ae} · ${run.node.host}</dd><dt>Calling AE</dt><dd>DIMSE_DASH</dd><dt>Outcome</dt><dd>${running()?'Waiting for simulated response':run.state==='stopped'?'Local stop intent; no protocol cancellation confirmation':'Illustrative success · 0x0000'}</dd><dt>Timeouts</dt><dd>Connect 30s · Association 30s · DIMSE 30s · Idle 60s</dd></dl><p class="foot">Demonstration only. These values are not observed DICOM evidence.</p></section>`}
function act(action){if(action==='back'){page='library';render();if(focusCard)document.getElementById(focusCard)?.focus({preventScroll:true});}if(action==='view'){origin=page;if(page==='library')libraryScroll=main.scrollTop;page='run';render();main.querySelector('.back').focus();}if(action==='return'){page=origin;render();main.querySelector('[data-action="view"]')?.focus();}if(action==='run'&&!running()){const current={node:{...selected},state:'running'};run=current;render();setTimeout(()=>{if(run===current&&current.state==='running'){current.state='success';const scroll=main.scrollTop;render();main.scrollTop=scroll;}},15000);}if(action==='stop'&&running()){run.state='stopped';render();}}
document.querySelector('#home').onclick=()=>{page='library';render()};['A','B'].forEach(o=>document.querySelector('#option'+o).onclick=()=>{if(page==='library')libraryScroll=main.scrollTop;option=o;render()});document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('light');document.querySelector('#theme').textContent=document.body.classList.contains('light')?'Dark theme':'Light theme'};render();
</script></body></html>
