<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DimseDash · Node library design options</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c20;--card:#1d2024;--raised:#282b30;--text:#e2e2e9;--muted:#aeb4c0;--line:#44474e;--blue:#aac7ff;--selected:#284777;--selected-text:#d6e3ff;--warn:#f0c278;--danger:#ffb4ab;--shadow:0 16px 40px #0005}
html[data-theme=light]{color-scheme:light;--bg:#f9f9ff;--panel:#f3f3fa;--card:#fff;--raised:#ededf4;--text:#191c20;--muted:#565f71;--line:#c4c6d0;--blue:#415f91;--selected:#d6e3ff;--selected-text:#284777;--warn:#805300;--danger:#ba1a1a;--shadow:0 16px 40px #14274318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 14px}button:hover{background:var(--raised)}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button.primary{background:var(--blue);color:var(--bg);border-color:var(--blue);font-weight:650}button.tonal,.active{background:var(--selected)!important;color:var(--selected-text)!important;border-color:transparent!important}.quiet{border-color:transparent}.muted,small{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}h1,h2,h3,p{margin:0}h1{font-size:26px;font-weight:620;letter-spacing:-.6px}h2{font-size:20px;font-weight:600}h3{font-size:16px;font-weight:600}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue)}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.prototype{padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}.prototype .title{font-size:13px;font-weight:600}.switch{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px}.switch button{border:0;padding:7px 12px}.explain{padding:10px 24px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.shell{display:grid;grid-template-columns:204px 1fr;min-height:calc(100vh - 132px)}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 14px;gap:30px}.brand{font-size:20px;font-weight:650;letter-spacing:-.5px;padding:0 10px}.brand span{color:var(--blue)}nav{display:grid;gap:6px}nav button{text-align:left;border:0;display:flex;gap:12px;align-items:center;padding:12px}.navicon{width:20px;text-align:center;font-size:17px}.receiver{margin-top:auto;padding:15px 10px 0;border-top:1px solid var(--line)}.receiver p{font-size:12px;margin-top:8px}.receiver .badge{margin-top:10px}main{min-width:0;padding:28px 32px 44px}.pagehead{margin-bottom:26px}.pagehead p{margin-top:6px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:12px;margin:22px 0 18px}.search{flex:1;max-width:430px;position:relative}.search input{width:100%;padding:10px 14px 10px 36px}.search span{position:absolute;left:12px;top:8px;font-size:20px;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:10px 12px;min-width:0}.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:650;letter-spacing:.3px;background:var(--raised);color:var(--muted)}.badge.production{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}.badge.test{background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--blue)}.badge.chosen{background:var(--selected);color:var(--selected-text)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.node{border:1px solid var(--line);border-radius:10px;background:var(--card);position:relative;min-width:0;transition:border-color .15s}.node:hover{border-color:var(--blue)}.node.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.node-open{display:block;width:100%;border:0;border-radius:10px 10px 0 0;text-align:left;padding:20px}.node-open:hover{background:color-mix(in srgb,var(--blue) 5%,var(--card))}.node-icon{width:42px;height:42px;display:grid;place-items:center;background:var(--selected);color:var(--selected-text);border-radius:10px;font-size:22px;margin-bottom:18px}.node h3{margin-bottom:12px;overflow-wrap:anywhere}.node .data{display:grid;grid-template-columns:65px 1fr;gap:5px;font-size:12px}.data dt{color:var(--muted)}.data dd{margin:0;overflow-wrap:anywhere}.nodefoot{border-top:1px solid var(--line);padding:9px 12px 9px 18px;display:flex;align-items:center;gap:8px;min-height:48px}.nodefoot small{font-size:11px}.more{margin-left:auto;font-size:20px;line-height:20px;padding:3px 10px;border:0}.list{grid-template-columns:1fr}.list .node{display:flex}.list .node-open{display:flex;align-items:center;gap:20px;border-radius:10px 0 0 10px}.list .node-icon{margin:0;flex-shrink:0}.list h3{width:190px;margin:0}.list dl{margin:0}.list .nodefoot{min-width:165px;border-top:0;border-left:1px solid var(--line)}.hint{margin-top:18px;font-size:12px;color:var(--muted)}.target{border:1px solid var(--line);background:var(--panel);padding:18px 20px;border-radius:10px;margin:20px 0}.target p{margin-top:4px}.target .row{gap:8px}.operation{margin-top:26px}.runbar{margin:20px 0 24px;display:flex;gap:10px;align-items:center}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:24px}.tabs button{border:0;border-radius:0;padding:12px 2px;color:var(--muted)}.tabs button.current{border-bottom:3px solid var(--blue);color:var(--blue)}.evidence{padding:26px 0}.evidencebox{border:1px solid var(--line);border-radius:10px;padding:24px;background:var(--card)}.evidencebox p{margin-top:8px}.empty{border:1px dashed var(--line);padding:54px 24px;text-align:center;border-radius:10px;grid-column:1/-1}.empty p{margin:8px 0 20px}.galleryB{padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:20px 0}.galleryB .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.galleryB .node-open{padding:16px}.galleryB .node-icon{display:none}.galleryB h3{margin-bottom:10px}.callout{border-left:3px solid var(--blue);background:var(--panel);padding:14px 18px;margin-top:24px;font-size:13px;color:var(--muted)}dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(600px,calc(100vw - 32px));box-shadow:var(--shadow)}dialog::backdrop{background:#0008}dialog h2{margin-bottom:6px}dialog p{margin-bottom:20px;color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}label{display:grid;gap:6px;font-size:12px;font-weight:600}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.danger{color:var(--danger)}#menu{position:fixed;z-index:5;width:205px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow)}#menu button{width:100%;border:0;text-align:left}#menu hr{border:0;border-top:1px solid var(--line);margin:5px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--selected);color:var(--selected-text);border:1px solid var(--blue);border-radius:10px;padding:12px 20px;z-index:20;box-shadow:var(--shadow)}[hidden]{display:none!important}.switcher-nodes{max-height:400px;overflow:auto;display:grid;gap:8px;margin-top:16px}.switcher-nodes button{text-align:left;display:flex;align-items:center;justify-content:space-between}.switcher-nodes small{display:block}.runstrip{padding:10px 16px;background:var(--selected);color:var(--selected-text);border-radius:8px;margin-bottom:22px}.testing{font-size:11px;letter-spacing:.3px;color:var(--muted)}@media(max-width:1000px){main{padding:24px}.shell{grid-template-columns:180px 1fr}.toolbar{flex-wrap:wrap}.list .node-open{flex-wrap:wrap}.list h3{width:auto}.prototype{gap:10px}.list .nodefoot{min-width:130px}}@media(max-width:740px){.shell{grid-template-columns:1fr}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.brand,.receiver{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}.navicon{display:none}main{padding:20px}.cards{grid-template-columns:1fr}.prototype{padding:12px}.explain{padding:10px 12px}.fields{grid-template-columns:1fr}.toolbar .search{flex-basis:100%;max-width:none}.list .node{display:block}.list .nodefoot{border-left:0;border-top:1px solid var(--line)}}
</style>
</head><body>
<header class="prototype"><div><div class="eyebrow">Design review · S1 refinement</div><div class="title">DICOM node library</div></div><div class="switch" aria-label="Design options"><button id="optionA" class="active" onclick="setOption('A')">A · Nodes dashboard</button><button id="optionB" onclick="setOption('B')">B · Workbench gallery</button></div><span class="grow"></span><button onclick="toggleTheme()" id="theme">Light appearance</button><button onclick="resetDemo(true)">Empty state</button><button class="quiet" onclick="resetDemo(false)">Reset demo</button></header>
<div class="explain" id="explain"></div>
<div class="shell"><aside><div class="brand"><span>▦</span> DimseDash</div><nav id="nav" aria-label="Main navigation"></nav><div class="receiver"><div class="eyebrow">Local receiver</div><p class="mono">DIMSE_DASH · Port 11112</p><span class="badge">◼ Stopped</span><p class="muted">Receiver unavailable in S1.</p></div></aside><main id="main"></main></div>
<div id="menu" hidden></div><dialog id="editor"></dialog><dialog id="removeDialog"></dialog><dialog id="switcher"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const initial=[{id:1,label:'Archive PACS',host:'192.0.2.10',port:104,ae:'PACS_AET',env:'production'},{id:2,label:'Integration sandbox',host:'192.0.2.20',port:4242,ae:'TEST_PACS',env:'test'},{id:3,label:'Migration staging',host:'192.0.2.30',port:11112,ae:'STAGING_AET',env:'test'},{id:4,label:'Orthanc local',host:'127.0.0.1',port:4242,ae:'ORTHANC',env:'test'},{id:5,label:'Research archive',host:'198.51.100.10',port:104,ae:'RESEARCH_AET',env:'test'},{id:6,label:'Vendor simulator',host:'198.51.100.20',port:11112,ae:'SIMULATOR_AET',env:'test'}];
let nodes=structuredClone(initial),option='A',page='nodes',selected=null,query='',env='all',layout='cards',expanded=true,tab='Summary',run=null,timer=null,nextId=7;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>nodes.find(n=>n.id===selected);const pill=n=>`<span class="badge ${n.env}">${n.env==='test'?'Test':'Production'}</span>`;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3500)}
function setOption(o){option=o;page=o==='A'?'nodes':'workbench';expanded=true;closeMenu();render()}
function toggleTheme(){const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme').textContent=light?'Dark appearance':'Light appearance'}
function resetDemo(empty){clearTimeout(timer);nodes=empty?[]:structuredClone(initial);selected=null;run=null;query='';env='all';expanded=true;nextId=7;page=option==='A'?'nodes':'workbench';render()}
function navigate(p){page=p;closeMenu();render()}
function selectNode(id){selected=id;page='workbench';expanded=false;tab='Summary';$('switcher').close();render()}
function render(){
$('optionA').classList.toggle('active',option==='A');$('optionB').classList.toggle('active',option==='B');
$('explain').textContent=option==='A'?'A — Recommended · A dedicated home for nodes; Workbench keeps the full space for diagnostics. Synthetic, session-only prototype.':'B — All in Workbench · Choose from cards above Echo; collapse the gallery to regain diagnostic space. Synthetic, session-only prototype.';
const nav=[...(option==='A'?[['nodes','▦','Nodes']]:[]),['workbench','▤','Workbench'],['files','▱','Received files'],['history','◷','History'],['settings','⚙','Settings']];
$('nav').innerHTML=nav.map(([p,i,t])=>`<button class="${p===page?'active':''}" ${p===page?'aria-current="page"':''} onclick="navigate('${p}')"><span class="navicon" aria-hidden="true">${i}</span>${t}</button>`).join('');
const strip=run?.state==='running'?`<div class="runstrip row between"><span>Demo Echo running · ${esc(run.node.label)} · navigation keeps this run active</span><button onclick="navigate('workbench')">View run</button></div>`:'';
$('main').innerHTML=strip+(page==='nodes'?dashboard():page==='workbench'?workbench():placeholder());
if(page==='nodes'||(page==='workbench'&&option==='B'&&expanded))renderCards();
}
function tools(){return `<div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input aria-label="Search nodes" placeholder="Search label, host or called AE…" value="${esc(query)}" oninput="query=this.value;renderCards()"></label><select aria-label="Filter environment" onchange="env=this.value;renderCards()"><option value="all" ${env==='all'?'selected':''}>All environments</option><option value="test" ${env==='test'?'selected':''}>Test</option><option value="production" ${env==='production'?'selected':''}>Production</option></select><span class="grow"></span><span class="muted" style="font-size:12px">Name A–Z</span><div class="switch"><button id="gridToggle" aria-label="Card view" onclick="setLayout('cards')">▦</button><button id="listToggle" aria-label="List view" onclick="setLayout('list')">☰</button></div></div>`}
function gallery(){return `${tools()}<div class="row between" style="margin-bottom:12px"><small id="count"></small><small>Open a node to prepare an operation</small></div><div id="cards" class="cards"></div><p class="hint">Selecting or saving a node sends no traffic. Connectivity is only observed after an explicit run.</p>`}
function dashboard(){return `<div class="pagehead row between wrap"><div><div class="eyebrow">Connections</div><h1>DICOM nodes</h1><p>Choose a destination. Open its workbench when you’re ready.</p></div><button class="primary" onclick="editNode(null)">＋ Add node</button></div>${gallery()}<div class="callout"><strong>One workspace, a clear destination.</strong> Cards open Workbench. Use the three-dot menu to edit, duplicate or remove a node. The selected target remains available when returning here.</div>`}
function setLayout(v){layout=v;renderCards()}
function renderCards(){const all=nodes.filter(n=>(env==='all'||n.env===env)&&[n.label,n.host,n.ae].some(v=>v.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>a.label.localeCompare(b.label)||a.id-b.id);$('cards').className='cards'+(layout==='list'?' list':'');$('gridToggle').classList.toggle('active',layout==='cards');$('listToggle').classList.toggle('active',layout==='list');$('gridToggle').setAttribute('aria-pressed',layout==='cards');$('listToggle').setAttribute('aria-pressed',layout==='list');$('count').textContent=`${all.length} of ${nodes.length} nodes`;
$('cards').innerHTML=all.map(n=>`<article class="node ${n.id===selected?'selected':''}"><button class="node-open" aria-label="Open ${esc(n.label)} in Workbench" onclick="selectNode(${n.id})"><div class="row between"><span class="node-icon" aria-hidden="true">▤</span></div><h3>${esc(n.label)}</h3><dl class="data"><dt>Called AE</dt><dd class="mono">${esc(n.ae)}</dd><dt>Endpoint</dt><dd class="mono">${esc(n.host)}:${n.port}</dd></dl></button><div class="nodefoot">${pill(n)}${n.id===selected?'<span class="badge chosen">Selected</span>':''}<button class="more" aria-label="Actions for ${esc(n.label)}" aria-haspopup="true" onclick="showMenu(event,${n.id})">⋮</button></div></article>`).join('')||(nodes.length?'<div class="empty"><h2>No matching nodes</h2><p>Try another label, host, called AE or environment.</p><button onclick="query=\'\';env=\'all\';render()">Clear filters</button></div>':'<div class="empty"><div class="eyebrow">Start here</div><h2>Add your first DICOM node</h2><p>Save a PACS endpoint and called AE, then open its workbench.</p><button class="primary" onclick="editNode(null)">＋ Add node</button></div>');}
function workbench(){const n=current();return `<div class="pagehead"><div class="eyebrow">Diagnostics</div><h1>Workbench</h1><p>Prepare an explicit operation and inspect the exchange.</p></div>${option==='B'&&expanded?`<section class="galleryB"><div class="row between"><h2>DICOM nodes</h2><div class="row"><button onclick="editNode(null)">＋ Add node</button>${n?'<button class="quiet" onclick="expanded=false;render()">Collapse</button>':''}</div></div>${gallery()}${n?`<div class="target"><div class="eyebrow">Target for next run</div><div class="row"><h3>${esc(n.label)}</h3>${pill(n)}</div><p class="mono">${esc(n.ae)} · ${esc(n.host)}:${n.port}</p></div>`:''}</section>`:`<section class="target row between wrap"><div><div class="eyebrow">Target for next run</div>${n?`<div class="row" style="margin-top:6px"><h2>${esc(n.label)}</h2>${pill(n)}</div><p class="mono">${esc(n.ae)} · ${esc(n.host)}:${n.port}</p>`:'<h2>No target selected</h2><p class="muted">Choose a saved node before running Echo.</p>'}</div><button onclick="${option==='A'?'openSwitcher()':'expanded=true;render()'}">${n?'Change node':'Choose node'} ▾</button></section>`}<div class="row muted" style="font-size:12px">Calling AE <span class="mono">DIMSE_DASH</span><span>·</span><span>Global timeouts: 30 / 30 / 30 / 60 s</span></div><section class="operation"><h2>Echo · Verification</h2><div class="runbar"><button class="primary" onclick="startRun()" ${!n||run?.state==='running'?'disabled':''}>▶ Run Echo</button><button onclick="stopRun()" ${run?.state==='running'?'':'disabled'}>Stop Echo</button><span class="testing">Simulated only · no networking</span></div><p class="muted" style="font-size:13px">Echo success proves only the verification exchange.</p><div class="tabs" role="tablist">${['Summary','Timeline','Negotiation','Trace'].map(t=>`<button role="tab" aria-selected="${tab===t}" class="${tab===t?'current':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><div class="evidence">${evidence()}</div></section>`}
function evidence(){if(!run)return '<div class="evidencebox"><h3>Ready when you are</h3><p>No Echo has run. Review the target, then choose Run Echo.</p><p class="muted">Changing nodes or opening a card never starts a connection.</p></div>';
const mismatch=run.node.id!==selected||JSON.stringify(run.node)!==JSON.stringify(current());const result=run.state==='running'?'Echo in progress':run.state==='stopped'?'Stopped locally · response not observed':'Verification response · 0x0000';return `<div class="evidencebox"><div class="eyebrow">Illustrative evidence · ${tab}</div><h2 style="margin-top:8px">${result}</h2><p><strong>Run target: ${esc(run.node.label)}</strong> · <span class="mono">${esc(run.node.ae)} · ${esc(run.node.host)}:${run.node.port}</span></p>${mismatch?'<p style="color:var(--warn)">The next-run target differs. This evidence remains attached to the original run.</p>':''}<p>${tab==='Summary'?'The executed target is frozen when Run Echo is pressed.':tab==='Timeline'?'Local start → association → verification exchange → cleanup. This draft illustrates placement only.':tab==='Negotiation'?'Negotiation details occupy this panel; no capabilities are inferred from the card.':'Trace is composed from typed observations; this prototype creates no protocol trace.'}</p></div>`}
function startRun(){run={node:structuredClone(current()),state:'running'};render();timer=setTimeout(()=>{if(run?.state==='running'){run.state='success';render()}},12000)}
function stopRun(){clearTimeout(timer);if(run)run.state='stopped';render()}
function placeholder(){const title={files:'Received files',history:'History',settings:'Settings'}[page];return `<div class="pagehead"><div class="eyebrow">Navigation preview</div><h1>${title}</h1></div><div class="evidencebox"><h2>${page==='settings'?'Global settings stay here':'Outside this node-library draft'}</h2><p>${page==='settings'?'Appearance, local calling AE, client listening port and global timeouts remain in Settings. Node editing reuses the existing connection fields.':'This destination remains in the navigation. The prototype focuses on node selection and management.'}</p><button style="margin-top:18px" onclick="navigate('workbench')">Back to Workbench</button></div>`}
function closeMenu(){ $('menu').hidden=true }
function showMenu(event,id){event.stopPropagation();const n=nodes.find(n=>n.id===id);$('menu').innerHTML=`<button onclick="selectNode(${id});closeMenu()">Open Workbench</button><button onclick="editNode(${id})">Edit node…</button><button onclick="editNode(${id},true)">Duplicate…</button><hr><button class="danger" onclick="removeNode(${id})">Remove node…</button>`;const r=event.currentTarget.getBoundingClientRect();$('menu').hidden=false;$('menu').style.left=Math.max(8,Math.min(innerWidth-215,r.right-205))+'px';$('menu').style.top=Math.max(8,Math.min(innerHeight-200,r.bottom+5))+'px';$('menu').querySelector('button').focus()}
document.addEventListener('click',e=>{if(!$('menu').contains(e.target))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function editNode(id,duplicate=false){closeMenu();const n=id?structuredClone(nodes.find(n=>n.id===id)):{label:'',host:'',port:104,ae:'',env:'test'};if(duplicate)n.label+=' copy';const editing=!!id&&!duplicate;$('editor').innerHTML=`<form id="nodeForm"><div class="eyebrow">${duplicate?'Unsaved duplicate':'Connection configuration'}</div><h2>${editing?'Edit node':duplicate?'Duplicate node':'Add DICOM node'}</h2><p>Saving changes configuration only. No connectivity check is sent.</p><div class="fields"><label class="full">Node label<input name="label" required maxlength="80" value="${esc(n.label)}" placeholder="e.g. Integration sandbox"></label><label>Called AE title<input name="ae" required maxlength="16" value="${esc(n.ae)}" placeholder="PACS_AET"></label><label>Environment<select name="env"><option value="test" ${n.env==='test'?'selected':''}>Test</option><option value="production" ${n.env==='production'?'selected':''}>Production</option></select></label><label>PACS host / IP<input name="host" required value="${esc(n.host)}" placeholder="192.0.2.10"></label><label>PACS port<input name="port" type="number" min="1" max="65535" required value="${n.port}"></label></div><small>Client calling AE: <span class="mono">DIMSE_DASH</span> · managed in Settings.</small><div class="actions"><button type="button" onclick="$ ('editor').close()">Discard</button><button class="primary">${editing?'Save changes':'Save & open Workbench'}</button></div></form>`;$('nodeForm').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),v={id:editing?id:nextId++,label:data.get('label').trim(),ae:data.get('ae').trim(),host:data.get('host').trim(),port:Number(data.get('port')),env:data.get('env')};if(!v.label||!v.ae||!v.host){toast('Complete all connection fields.');return}if(editing)nodes=nodes.map(x=>x.id===id?v:x);else{nodes.push(v);selected=v.id;page='workbench';expanded=false}query='';env='all';$('editor').close();render();toast('Saved in this prototype only. No traffic sent.')};$('editor').showModal()}
function removeNode(id){closeMenu();const n=nodes.find(n=>n.id===id);$('removeDialog').innerHTML=`<h2>Remove ${esc(n.label)}?</h2><p>Remove this saved configuration. ${selected===id?'The selected target will be cleared. ':''}Run history and active evidence are retained.</p><div class="actions"><button onclick="$ ('removeDialog').close()">Keep node</button><button class="danger" onclick="confirmRemove(${id})">Remove node</button></div>`;$('removeDialog').showModal()}
function confirmRemove(id){nodes=nodes.filter(n=>n.id!==id);if(selected===id)selected=null;$('removeDialog').close();render()}
function openSwitcher(){ $('switcher').innerHTML=`<h2>Change target node</h2><p>Applies to the next run. Active Echo and its evidence keep their original target.</p><input style="width:100%" aria-label="Search target nodes" placeholder="Search label, host or called AE…" oninput="switchList(this.value)"><div id="switchList" class="switcher-nodes"></div><div class="actions"><button onclick="$ ('switcher').close();navigate('nodes')">Manage nodes</button><button onclick="$ ('switcher').close()">Close</button></div>`;switchList('');$('switcher').showModal()}
function switchList(q){$('switchList').innerHTML=nodes.filter(n=>[n.label,n.host,n.ae].some(v=>v.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>a.label.localeCompare(b.label)||a.id-b.id).map(n=>`<button onclick="selectNode(${n.id})"><span>${esc(n.label)}<small class="mono">${esc(n.ae)} · ${esc(n.host)}:${n.port}</small></span>${pill(n)}</button>`).join('')||'<p>No matching nodes.</p>'}
render();
</script></body></html>
