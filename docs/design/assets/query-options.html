<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DimseDash · Query design options</title>
<style>
:root{color-scheme:light;--bg:#f9f9ff;--panel:#fff;--rail:#f3f3fa;--ink:#191c20;--muted:#565f71;--line:#c4c6d0;--blue:#415f91;--onblue:#fff;--tint:#d6e3ff;--tintink:#284777;--warn:#755600;--warnbg:#fff5d6} [data-theme=dark]{color-scheme:dark;--bg:#111318;--panel:#191c22;--rail:#1d2027;--ink:#e2e2e9;--muted:#bec6dc;--line:#44474e;--blue:#aac7ff;--onblue:#0a305f;--tint:#284777;--tintink:#d6e3ff;--warn:#f0d37b;--warnbg:#342d19}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:transparent;color:var(--ink)}button:hover{background:var(--rail)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.primary{background:var(--blue);color:var(--onblue);border-color:var(--blue)}.primary:hover{filter:brightness(.94);background:var(--blue)}.ghost{border-color:transparent;color:var(--blue)}.pill{display:inline-block;font-size:12px;border-radius:6px;padding:3px 8px;background:var(--tint);color:var(--tintink)}.muted,small{color:var(--muted)}small{display:block;font-size:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}h1{font-size:26px;line-height:1.2;margin:7px 0 10px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}p{margin:7px 0}.lab{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--rail)}.lab strong{font-size:13px}.chosen{background:var(--tint);color:var(--tintink);border-color:var(--blue)}.appbar{padding:16px 24px;border-bottom:1px solid var(--line)}.appbar strong{font-size:21px}.frame{display:grid;grid-template-columns:192px minmax(0,1fr);height:calc(100vh - 155px);min-height:420px}.sidebar{background:var(--rail);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;overflow:auto;gap:6px}.sidebar button{text-align:left;border:0;padding:11px 14px}.receiver{margin-top:auto;padding:32px 10px 0}.receiver>div{border-top:1px solid var(--line);padding-top:12px}.receiver p{margin:3px 0}.receiver .status{margin:14px 0 6px;display:flex;gap:8px;align-items:center}main{padding:20px 28px 40px;overflow:auto;min-width:0}.nodeheader{margin-bottom:14px}.nodeheader .back{padding-left:0}.operations{display:flex;border-bottom:1px solid var(--line);gap:16px;margin:16px 0 18px}.operations button,.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;padding:10px 12px}.operations .active,.tabs .active{border-bottom-color:var(--blue);color:var(--blue);font-weight:600}.operations .future{align-self:center;font-size:12px;color:var(--muted)}.workgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}.workgrid>div{min-width:0}.workgrid.split{grid-template-columns:minmax(310px,390px) minmax(0,1fr);align-items:start}.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:0;overflow:hidden}.cardhead{padding:15px 18px;border-bottom:1px solid var(--line)}.pad{padding:18px}.tabs{display:flex;gap:3px;overflow:auto;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.fields label{min-width:0;display:block;font-size:13px}.fields input,.fields select{margin-top:6px;width:100%;min-height:41px}.fields small{margin-top:4px}.split .fields{grid-template-columns:1fr}.split .tabs{flex-wrap:wrap;white-space:normal}.split .tabs button{padding:8px;font-size:12px}.split .cardhead{align-items:flex-start}input,select{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 10px;border-radius:7px;min-width:0}.datepair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{border-left:3px solid var(--blue);background:var(--rail);padding:9px 12px;margin-top:16px;font-size:12px}.warn{background:var(--warnbg);color:var(--warn);padding:10px 14px;font-size:13px}.actions{padding:12px 18px;border-top:1px solid var(--line)}.actions small{max-width:500px}.scroller{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--rail)}td,th{padding:13px 15px;border-bottom:1px solid var(--line)}td{font-size:13px}td strong{font-weight:600}tr.selected{background:var(--tint)}table button{font-size:12px;padding:5px 9px}td input:not([type=checkbox]){width:160px;font:12px ui-monospace,monospace}.empty{text-align:center;padding:48px 20px}.mono,pre{font:12px/1.8 ui-monospace,SFMono-Regular,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--rail);border-radius:8px;padding:16px;margin:0}.stack{display:grid;gap:18px}.evidence{margin-top:18px}.evidence summary{padding:12px 18px;cursor:pointer}.detail{display:grid;grid-template-columns:1fr 1fr;gap:18px}.summaryline{padding:14px 18px;background:var(--rail);font-size:13px}.topnote{font-size:12px;margin-bottom:12px}.notice{padding:12px;background:var(--rail);border-radius:8px}.demo-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:12px}.demo-controls select{padding:5px}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:640px;width:90%;padding:24px}dialog::backdrop{background:#0008}.endnote{font-size:12px;margin-top:18px}.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}.library button{text-align:left;padding:24px}.library h2{margin-bottom:12px}@media(max-width:1100px){.workgrid.split{grid-template-columns:1fr}.split .fields{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:repeat(2,minmax(0,1fr))} }@media(max-width:800px){.frame{grid-template-columns:160px minmax(0,1fr)}main{padding:16px}.fields,.split .fields{grid-template-columns:1fr}.lab{padding:8px 12px}.appbar{padding:12px 16px}.detail{grid-template-columns:1fr}.library{grid-template-columns:1fr}.frame{height:calc(100vh - 180px)}}
</style></head><body>
<div class="lab"><div class="row between"><div class="row"><strong>DESIGN REVIEW · QUERY</strong><button id="optionA" class="chosen" data-layout="stack">A · Full-width composer</button><button id="optionB" data-layout="split">B · Side composer</button></div><button id="theme">Dark theme</button></div><small id="layoutnote">Recommended · generous tables and exact Identifier editing; collapse the composer when reviewing results.</small></div>
<header class="appbar row between"><strong>DimseDash</strong><div class="row"><span class="pill">Synthetic prototype · no networking</span><button class="ghost" id="mask">Reveal values</button></div></header>
<div class="frame"><aside class="sidebar"><button class="chosen" data-action="library">▤ &nbsp; Nodes</button><button disabled>▱ &nbsp; Received files</button><button disabled>◷ &nbsp; History</button><button disabled>⚙ &nbsp; Settings</button><div class="receiver"><div><small>LOCAL RECEIVER</small><p>DIMSE_DASH<br>Port 11112</p><div class="status">⊙ <span>Stopped</span></div><small>Receiver unavailable in this build.</small></div></div></aside><main id="main"></main></div>
<dialog id="dialog"><div id="dialogbody"></div><div style="text-align:right;margin-top:20px"><button id="close">Close</button></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const s={layout:'stack',tab:'filters',page:'workspace',op:'query',level:'STUDY',parent:null,series:null,collapsed:false,reveal:false,active:false,scenario:'complete',dirty:false,selection:null,run:null,rows:[],draft:{patient:'',name:'',accession:'',from:'2026-10-01',to:'2026-10-22',modality:'CT',body:''},purpose:{},enabled:{},custom:false};let timer;
const fixtures=[{id:'2.25.101',name:'DEMO^ALPHA',patient:'SYNTH-101',acc:'DEMO-1001',desc:'CT Chest without contrast',date:'2026-10-21',mod:'CT',count:'3'},{id:'2.25.102',name:'DEMO^BETA',patient:'SYNTH-102',acc:'DEMO-1002',desc:'CT Abdomen and pelvis',date:'2026-10-18',mod:'CT',count:'4'},{id:'2.25.103',name:'DEMO^GAMMA',patient:'SYNTH-103',acc:'DEMO-1003',desc:'CT Chest with contrast',date:'2026-10-12',mod:'CT',count:'Not returned'}];
function sensitive(v){return s.reveal?esc(v):'••••••'}
function definitions(){return s.level==='STUDY'?[['patient','0010,0020','PatientID','LO'],['name','0010,0010','PatientName','PN'],['accession','0008,0050','AccessionNumber','SH'],['date','0008,0020','StudyDate','DA'],['modality','0008,0061','ModalitiesInStudy','CS']]:s.level==='SERIES'?[['modality','0008,0060','Modality','CS'],['body','0018,0015','BodyPartExamined','CS']]:[]}
function value(k){return k==='date'?(s.draft.from.replaceAll('-','')+'-'+s.draft.to.replaceAll('-','')):s.draft[k]||''}
function purpose(k){return s.purpose[k]||(value(k)?'Match':'Return')}
function identifier(){let lines=['(0008,0052) CS QueryRetrieveLevel = '+s.level];if(s.parent)lines.push('(0020,000D) UI StudyInstanceUID = '+s.parent.id);if(s.series)lines.push('(0020,000E) UI SeriesInstanceUID = '+s.series.id);definitions().forEach(([k,tag,name,vr])=>{if(s.enabled[k]!==false)lines.push('('+tag+') '+vr+' '+name+' = '+(purpose(k)==='Return'?'<empty · return key>':value(k)||'<invalid · match value required>'))});lines.push(s.level==='STUDY'?'(0020,000D) UI StudyInstanceUID = <empty · return key>':s.level==='SERIES'?'(0020,000E) UI SeriesInstanceUID = <empty · return key>':'(0008,0018) UI SOPInstanceUID = <empty · return key>');lines.push(s.level==='STUDY'?'(0008,1030) LO StudyDescription = <empty · return key>':s.level==='SERIES'?'(0008,103E) LO SeriesDescription = <empty · return key>':'(0020,0013) IS InstanceNumber = <empty · return key>');if(s.level==='STUDY')lines.push('(0020,1206) IS NumberOfStudyRelatedSeries = <empty · return key>');return lines.join('\n')}
function button(text,act,cls='',disabled=false){return `<button data-action="${act}" class="${cls}" ${disabled?'disabled':''}>${text}</button>`}
function input(k,label,hint='',type='text'){return `<label>${label}<input data-field="${k}" type="${type}" value="${esc(s.draft[k])}" ${s.active?'disabled':''}>${hint?'<small>'+hint+'</small>':''}${s.enabled[k]===false?'<small>Advanced: disabled · omitted from request</small>':s.purpose[k]==='Return'?'<small>Advanced: return key · empty on wire</small>':''}</label>`}
function filters(){return `<div class="pad"><div class="fields">${s.level==='STUDY'?input('patient','Patient ID','(0010,0020) · no automatic wildcard')+input('name','Patient name','(0010,0010) · Family^Given; patterns explicit')+input('accession','Accession number','(0008,0050)')+`<div>Study date period<div class="datepair"><label>From<input aria-label="Study date from" type="date" data-field="from" value="${s.draft.from}" ${s.active?'disabled':''}></label><label>Through<input aria-label="Study date through" type="date" data-field="to" value="${s.draft.to}" ${s.active?'disabled':''}></label></div><small>Inclusive · (0008,0020)</small></div>`:`<div class="notice">Parent study UID<br><span class="mono">${sensitive(s.parent.id)}</span>${s.series?'<br>Parent series UID<br><span class="mono">'+sensitive(s.series.id)+'</span>':''}</div>`}${s.level!=='IMAGE'?`<label>${s.level==='STUDY'?'Modalities in study':'Series modality'}<select data-field="modality" ${s.active?'disabled':''}>${['','CT','MR','DX','US'].map(v=>`<option value="${v}" ${s.draft.modality===v?'selected':''}>${v||'Any · request return key'}</option>`).join('')}</select><small>${s.level==='STUDY'?'(0008,0061) · optional matching support unknown':'(0008,0060)'}</small></label>`+input('body',s.level==='STUDY'?'Body part · next series query':'Body part','(0018,0015) · '+(s.level==='STUDY'?'not sent in this study query':'matching support unknown')):''}</div><div class="hint">${s.level==='STUDY'?'Patient ID, name and accession are independent fields. Filled matching keys are combined; there is no automatic OR search.':'Required parent UIDs are fixed from the selected result. Opening this level sends no request.'}</div>${s.draft.body&&s.level==='STUDY'?'<div class="warn" style="margin-top:12px">Body part '+esc(s.draft.body)+' is pending: find studies → open a study → explicitly find series. Study rows are not body-part-filtered.</div>':''}</div>`}
function advanced(){return `<div class="pad"><small>Same draft as Filters · numeric paths · explicit matching/return intent</small></div><div class="scroller"><table><thead><tr><th>On</th><th>Tag path / VR</th><th>Purpose</th><th>Value</th></tr></thead><tbody><tr><td>Required</td><td>(0008,0052) · CS<small>QueryRetrieveLevel</small></td><td>Service-required</td><td>${s.level}</td></tr>${definitions().map(([k,tag,name,vr])=>`<tr><td><input aria-label="Enable ${name}" type="checkbox" data-enable="${k}" ${s.enabled[k]!==false?'checked':''}></td><td class="mono">(${tag}) · ${vr}<small>${name}</small></td><td><select aria-label="Purpose of ${name}" data-purpose="${k}"><option ${purpose(k)==='Match'?'selected':''}>Match</option><option ${purpose(k)==='Return'?'selected':''}>Return</option></select></td><td><input aria-label="${name} advanced value" data-advanced="${k}" value="${esc(value(k))}" ${purpose(k)==='Return'?'disabled':''}><small>${purpose(k)==='Return'?'Empty on wire; saved draft value retained':'Peer matching support not validated'}</small></td></tr>`).join('')}</tbody></table></div><div class="pad">${button('＋ Add tag / sequence','tag')}<small style="margin-top:8px">Prototype edits common keys only. Full structured tag paths, private creators and sequence items remain required for S2.</small></div>`}
function resolved(){return `<div class="pad"><div class="row between"><h3>Next request · ${s.level}</h3><span class="pill">Read-only</span></div><p class="muted">C-FIND · Study Root · DEMO_PACS · 192.0.2.10:4242<br>Calling AE DIMSE_DASH · command settings are outside the Identifier</p><pre>${s.reveal?esc(identifier()):'Identifier values masked. Use Reveal values to inspect the exact synthetic draft.'}</pre><small style="margin-top:10px">Application-level request preview, not a packet capture. A run freezes its own copy. ${s.level==='STUDY'?'Body part is excluded at this level.':''}</small></div>`}
function composer(){return `<section class="card"><div class="cardhead row between"><div><h2>Query criteria</h2><small>Study Root / ${s.level} · C-FIND</small></div>${button(s.collapsed?'Edit criteria':'Collapse', 'collapse','ghost')}</div>${s.collapsed?`<div class="summaryline">${esc(s.draft.from)} – ${esc(s.draft.to)} · ${esc(s.draft.modality||'Any modality')} · ${s.level}<small>Expand to inspect all matching and return keys.</small></div>`:`<nav class="tabs" aria-label="Query editor">${[['filters','Filters'],['advanced','Advanced Identifier'],['resolved','Resolved Identifier']].map(([v,l])=>`<button data-tab="${v}" class="${s.tab===v?'active':''}">${l}</button>`).join('')}</nav>${s.tab==='filters'?filters():s.tab==='advanced'?advanced():resolved()}`}<div class="actions row between"><small>Only Run Query sends a request in the proposed app.</small><div class="row">${s.active?button('Cancel query','cancel'):''}${button(s.active?'Query running…':s.level==='STUDY'?'Run Query · simulated':s.level==='SERIES'?'Find series · simulated':'Find instances · simulated','run','primary',s.active)}</div></div></section>`}
function resultPanel(){const level=s.level==='STUDY'?'Studies':s.level==='SERIES'?'Series':'Instances';return `<section class="card"><div class="cardhead row between"><div class="row">${button('Studies','studies','ghost')}${s.parent?'<span>›</span>'+button('Series','series','ghost'):''}${s.series?'<span>› Instances</span>':''}</div><span class="pill">${s.rows.length} ${level.toLowerCase()}</span></div>${s.run?`<div class="summaryline"><strong>${esc(s.run.status)}</strong><small>DEMO_PACS · ${s.run.level} · ${s.run.id} · fixed synthetic scenario</small></div>`:''}${s.dirty&&s.run?'<div class="warn">Draft changed — rows belong to the previous executed Identifier, not these edits.</div>':''}${s.rows.length?`<div class="scroller"><table><thead><tr><th>${s.level==='STUDY'?'Study / patient':s.level==='SERIES'?'Series':'Instance'}</th><th>${s.level==='STUDY'?'Date / modality':'Modality'}</th><th>${s.level==='STUDY'?'Accession / series':s.level==='SERIES'?'Body part':'SOP UID'}</th><th>Actions</th></tr></thead><tbody>${s.rows.map((r,i)=>`<tr class="${s.selection===i?'selected':''}"><td><strong>${esc(r.desc)}</strong><small>${sensitive(r.name)} · ${sensitive(r.patient)}</small></td><td>${r.date}<small>${r.mod}</small></td><td>${s.level==='STUDY'?sensitive(r.acc)+'<small>'+(r.count==='Not returned'?'Series count not returned':r.count+' series')+'</small>':s.level==='SERIES'?r.body:sensitive(r.id)}</td><td><div class="row"><button data-inspect="${i}">Inspect</button>${s.level!=='IMAGE'?`<button data-open="${i}">Open ${s.level==='STUDY'?'series':'instances'} →</button>`:''}<button data-select="${i}">Select</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h2>${s.active?'Waiting for responses…':s.run?.kind==='empty'?'No matches returned':s.run?.kind==='failed'?'Query failed — not an empty result':'Ready to find '+level.toLowerCase()}</h2><p class="muted">${s.run?.kind==='failed'?'Association rejected in this synthetic scenario. Parent results remain available.':'Review the draft, then run explicitly. No request is sent by navigation.'}</p></div>`}<div class="actions row between"><small>${s.selection===null?'Inspect metadata or select one retrieval target.':esc(s.rows[s.selection].desc)+' · '+(s.level==='IMAGE'?'this instance only':'all instances in this '+s.level.toLowerCase())}</small>${button('Review retrieve…','retrieve','',s.selection===null||s.active)}</div></section>`}
function evidence(){if(!s.run)return '';return `<details class="card evidence"><summary>Query evidence · ${esc(s.run.status)} · executed Identifier</summary><div class="pad"><p>Frozen node: DEMO_PACS · ${s.run.level} · ${s.run.id}</p><pre>${s.reveal?esc(s.run.identifier):'Executed Identifier values masked.'}</pre><p class="muted">${esc(s.run.note)}</p><small>Proposed evidence reuses the Summary / Timeline / Negotiation / Trace presentation. This draft shows only a synthetic summary and frozen Identifier.</small></div></details>`}
const saved={};function saveContext(){saved[s.level]={rows:s.rows,run:s.run,dirty:s.dirty,parent:s.parent,series:s.series}}
function render(){document.querySelectorAll('[data-layout]').forEach(b=>{b.classList.toggle('chosen',b.dataset.layout===s.layout);b.setAttribute('aria-pressed',b.dataset.layout===s.layout)});$('layoutnote').textContent=s.layout==='stack'?'Recommended · generous tables and exact Identifier editing; collapse the composer when reviewing results.':'Alternative · keep criteria beside results for frequent refinement; stacks vertically in narrower windows.';$('mask').textContent=s.reveal?'Mask values':'Reveal values';if(s.page==='library'){$('main').innerHTML='<h1>DICOM nodes</h1><p class="muted">Design preview · the existing searchable card library remains unchanged.</p><div class="library"><button data-action="workspace"><h2>Demo archive <span class="pill">Test</span></h2><p>DEMO_PACS · 192.0.2.10:4242</p><small>Open node workbench →</small></button></div>';return}
$('main').innerHTML=`<header class="nodeheader"><button class="ghost back" data-action="library">← All nodes</button><div class="row"><h1>Demo archive</h1><span class="pill">Test</span></div><p class="muted">DEMO_PACS · 192.0.2.10:4242 &nbsp; · &nbsp; Calling AE DIMSE_DASH</p><details><summary class="muted">Connection details</summary><small>Connect 30s · Association 30s · DIMSE 30s · Idle 60s</small></details></header><nav class="operations" aria-label="Operation"><button data-op="echo" class="${s.op==='echo'?'active':''}">Echo</button><button data-op="query" class="${s.op==='query'?'active':''}">Query</button><span class="future">Retrieve follows target selection</span></nav>${s.op==='query'?`<div class="topnote muted">Synthetic response fixtures illustrate layout and states; they do not evaluate criteria or emulate a PACS.</div><div class="workgrid ${s.layout==='split'?'split':''}">${composer()}<div>${resultPanel()}${evidence()}</div></div><div class="demo-controls"><strong>Prototype scenario</strong><select id="scenario" aria-label="Prototype response scenario">${[['complete','Complete · 3 study fixtures'],['empty','No matches'],['partial','Partial · local result limit'],['failed','Association rejected']].map(([v,l])=>`<option value="${v}" ${s.scenario===v?'selected':''}>${l}</option>`).join('')}</select><span class="muted">Choose, then Run Query. Changes stay in this tab only.</span></div><p class="endnote muted">Session-only drafts and results · No automatic child queries · Optional-key matching remains unknown</p>`:'<section class="card pad"><h2>Echo · Verification</h2><p>The implemented Echo workflow stays here, unchanged. This prototype focuses on Query.</p>'+button('Return to Query','query','primary')+'</section>'}`;}
function markDirty(){s.dirty=!!s.run;const n=document.querySelector('.workgrid');if(n&&s.run&&!n.querySelector('.warn.draft')){const d=document.createElement('div');d.className='warn draft';d.textContent='Draft changed — existing rows belong to the previous executed Identifier.';n.before(d)}}
function show(html){$('dialogbody').innerHTML=html;$('dialog').showModal()}
let seq=0;function run(){if(s.active)return;const invalid=definitions().some(([k])=>s.enabled[k]!==false&&purpose(k)==='Match'&&!value(k));if(invalid){show('<h2>Matching value required</h2><p>Use Return for an empty return key, or disable the entry explicitly.</p>');return}if(s.level==='STUDY'&&(!s.draft.from||!s.draft.to||s.draft.from>s.draft.to)){show('<h2>Check study dates</h2><p>This prototype requires both dates, with From no later than Through.</p>');return}s.active=true;s.selection=null;s.rows=[];s.dirty=false;s.run={id:'demo-find-'+(++seq),level:s.level,identifier:identifier(),status:'Query running · simulated',note:'Awaiting a synthetic response.',kind:'running'};render();timer=setTimeout(()=>{s.active=false;s.rows=s.scenario==='empty'||s.scenario==='failed'?[]:s.level==='STUDY'?fixtures.map(r=>({...r})):s.level==='SERIES'?[{...s.parent,id:s.parent.id+'.1',desc:'Series 1 · axial',body:'CHEST'},{...s.parent,id:s.parent.id+'.2',desc:'Series 2 · reformatted',body:'CHEST'}]:[{...s.series,id:s.series.id+'.1',desc:'Instance 1'},{...s.series,id:s.series.id+'.2',desc:'Instance 2'}];if(s.scenario==='partial')s.rows=s.rows.slice(0,1);s.run.kind=s.scenario;s.run.status=({complete:'Complete · final 0x0000 · simulated',empty:'Complete · 0 matches · final 0x0000 · simulated',partial:'Partial · local limit reached · simulated',failed:'Association rejected · no DIMSE response · simulated'})[s.scenario];s.run.note=s.scenario==='partial'?'Local limit reached; cancellation requested. Final response not observed. Completeness is not established.':s.scenario==='failed'?'A-ASSOCIATE-RJ: result 1, source 1, reason 7. Synthetic peer rejection.':'Final C-FIND response observed in fixture. Optional matching-key support remains unknown.';saveContext();render()},1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){s.layout=b.dataset.layout;render();return}if(b.dataset.tab){s.tab=b.dataset.tab;render();return}if(b.dataset.op){s.op=b.dataset.op;render();return}if(b.dataset.inspect!==undefined){const r=s.rows[Number(b.dataset.inspect)];show(`<h2>Returned metadata · ${s.level}</h2><p>Inspection does not select a retrieval target.</p><pre>${s.reveal?esc('UID = '+r.id+'\nPatientID = '+r.patient+'\nPatientName = '+r.name+'\nDescription = '+r.desc):'Values masked. Close and choose Reveal values to inspect.'}</pre><p class="muted">Synthetic returned values; not proof that the peer applied optional matching keys.</p>`);return}if(b.dataset.select!==undefined){s.selection=Number(b.dataset.select);render();return}if(b.dataset.open!==undefined&&!s.active){saveContext();const r=s.rows[Number(b.dataset.open)];if(s.level==='STUDY'){delete saved.SERIES;delete saved.IMAGE;s.parent=r;s.series=null;s.level='SERIES'}else{delete saved.IMAGE;s.series=r;s.level='IMAGE'}s.rows=[];s.run=null;s.selection=null;s.dirty=false;s.collapsed=false;render();return}switch(b.id||b.dataset.action){case 'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';b.textContent=document.documentElement.dataset.theme==='light'?'Dark theme':'Light theme';return;case 'mask':s.reveal=!s.reveal;break;case 'close':$('dialog').close();return;case 'library':s.page='library';break;case 'workspace':s.page='workspace';break;case 'collapse':s.collapsed=!s.collapsed;break;case 'query':s.op='query';break;case 'run':run();return;case 'cancel':clearTimeout(timer);s.active=false;s.run.status='Cancellation requested · final confirmation not observed · simulated';s.run.note='User intent is recorded separately from terminal peer evidence.';break;case 'studies':case 'series':if(s.active)return;{const level=b.dataset.action==='studies'?'STUDY':'SERIES';Object.assign(s,saved[level]||{rows:[],run:null,parent:null,series:null});s.level=level;s.selection=null;s.dirty=!!s.run;s.collapsed=false;}break;case 'retrieve':{const r=s.rows[s.selection];show(`<h2>Retrieval handoff · design boundary</h2><p>${esc(r.desc)} · ${s.level==='IMAGE'?'this instance only':'all instances in this '+s.level.toLowerCase()}</p><pre>${s.reveal?esc((s.parent?'StudyInstanceUID = '+s.parent.id+'\n':'StudyInstanceUID = '+r.id+'\n')+(s.level==='SERIES'?'SeriesInstanceUID = '+r.id:s.level==='IMAGE'?'SeriesInstanceUID = '+s.series.id+'\nSOPInstanceUID = '+r.id:'')):'Target UIDs masked.'}</pre><p>The next design will review C-GET / C-MOVE and destination readiness. No retrieval is performed here.</p>`);return}case 'tag':show('<h2>Structured tag editor · design sketch</h2><p>The production editor supports numeric tag paths, VR, purpose, enabled state and value, with expandable sequence items.</p><pre>(0040,0275) SQ RequestAttributesSequence\n  Item · one matching group\n    (0040,1001) SH RequestedProcedureID</pre><p>Illustrative structure only: model/level and peer support must be validated. This prototype does not author arbitrary tags or sequences.</p>');return}render()});
