<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DimseDash · Retrieve design options</title>
<style>
:root{color-scheme:light;--bg:#f9f9ff;--panel:#fff;--rail:#f0f2f8;--ink:#191c20;--muted:#5b6372;--line:#c4c6d0;--blue:#415f91;--onblue:#fff;--tint:#d6e3ff;--tintink:#284777;--warn:#705600;--warnbg:#fff3cd;--good:#246653;--goodbg:#e4f4ed;--error:#ba1a1a}
[data-theme=dark]{color-scheme:dark;--bg:#111318;--panel:#191c22;--rail:#1d2027;--ink:#e2e2e9;--muted:#bec6dc;--line:#44474e;--blue:#aac7ff;--onblue:#0a305f;--tint:#284777;--tintink:#d6e3ff;--warn:#f0d37b;--warnbg:#342d19;--good:#94d5bf;--goodbg:#18382f;--error:#ffb4ab}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}button,select,input{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:var(--panel);cursor:pointer}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button.primary{background:var(--blue);color:var(--onblue);border-color:var(--blue)}button.ghost{background:transparent;border-color:transparent;color:var(--blue)}button.chosen{background:var(--tint);border-color:var(--blue);color:var(--tintink)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted,small{color:var(--muted)}small{display:block;font-size:12px}.pill{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--rail);font-size:12px}.blue{background:var(--tint);color:var(--tintink)}.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px}.good{background:var(--goodbg);color:var(--good)}h1{font-size:25px;line-height:1.25;margin:4px 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;margin:0 0 7px}p{margin:6px 0 12px}.lab{background:var(--rail);border-bottom:1px solid var(--line);padding:12px 20px}.lab small{margin-top:6px}.appbar{padding:14px 22px;border-bottom:1px solid var(--line)}.appbar strong{font-size:21px}.frame{display:grid;grid-template-columns:184px minmax(0,1fr);height:calc(100dvh - 151px);min-height:400px}.sidebar{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:7px;overflow:auto}.sidebar button{text-align:left;border:0;background:transparent}.sidebar .chosen{background:var(--tint)}.receiver{margin-top:auto;padding:26px 6px 6px}.receiver>div{border-top:1px solid var(--line);padding-top:14px}.receiver p{margin:3px 0}.receiver-status{margin:12px 0!important;display:flex;gap:8px}.workspace{overflow:auto;padding:22px;min-width:0}.node{margin-bottom:18px}.node h1{font-size:22px}.banner{background:var(--tint);color:var(--tintink);border-radius:8px;padding:9px 13px;margin-bottom:18px}.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:18px;margin:0 0 16px}.hero{border-left:4px solid var(--blue)}.hero h2{margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.method{text-align:left;padding:14px;min-height:116px}.method strong{font-size:17px;display:block;margin-bottom:5px}.method small{color:inherit}.steps{color:var(--muted);font-size:12px;letter-spacing:.04em;margin:10px 0}.steps strong{color:var(--blue)}.path{font-family:ui-monospace,monospace;overflow-wrap:anywhere;background:var(--rail);border-radius:6px;padding:9px 10px}.mini{font-size:12px}.divider{border-top:1px solid var(--line);margin:14px 0}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.actions small{max-width:430px}.checks{display:grid;gap:9px;margin:12px 0}.check{display:flex;gap:9px;align-items:start}.check b{color:var(--good)}.check span{flex:1}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}details>div{margin-top:12px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th{font-size:12px;color:var(--muted);font-weight:600}td,th{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}code{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}.selected td{background:var(--tint)}.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat strong{display:block;font-size:25px;font-weight:600}.stat small{font-size:11px}.status-band{padding:16px;border-radius:8px;background:var(--rail);margin:14px 0}.track{height:5px;background:var(--line);border-radius:8px;margin-top:14px;overflow:hidden}.track>span{display:block;height:100%;background:var(--blue)}.activity{padding-left:20px;margin:10px 0}.activity li{margin-bottom:8px}.split{display:grid;grid-template-columns:minmax(230px,1fr) minmax(490px,1.3fr);gap:18px;align-items:start}.sheet{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:18px;box-shadow:0 8px 25px #0000000d}.sheet .grid{grid-template-columns:1fr}.sheet .card{padding:14px}.sheet .method{min-height:105px}.context h2{font-size:18px}.context .card{padding:13px}.context td{padding:9px 5px}.context .wide{display:none}.context .selected td{background:var(--tint)}.demo-controls{border:1px dashed var(--line);border-radius:8px;padding:12px;margin:16px 0}.demo-controls label{font-size:12px;font-weight:600}select,input{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px;max-width:100%}label{display:block;margin-bottom:5px}input{width:100%}.uid-editor{display:grid;gap:12px}.state-note{font-size:12px;color:var(--muted);margin-top:8px}.crumb{margin-bottom:12px}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:min(640px,90vw);max-height:85vh;padding:24px;overflow:auto}dialog::backdrop{background:#0006}.thumb{border:1px dashed var(--line);border-radius:8px;padding:26px;text-align:center;background:var(--rail)}.empty{padding:24px;text-align:center}.hidden{display:none!important}a{color:var(--blue)}
@media(max-width:1100px){.split{display:block}.split>.context{display:none}.sheet{box-shadow:none;padding:0;border:0;background:none}.grid{grid-template-columns:1fr}.frame{grid-template-columns:170px minmax(0,1fr)}}
@media(max-width:780px){.lab{padding:8px 12px}.frame{height:calc(100dvh - 170px);grid-template-columns:154px minmax(0,1fr)}.workspace{padding:14px}.appbar{padding:11px 16px}.sidebar{padding:12px 8px}.methods{grid-template-columns:1fr}.method{min-height:0}.stat-grid{grid-template-columns:1fr 1fr}.card{padding:14px}.lab small{font-size:11px}}
</style></head>
<body><div class="lab"><div class="row between"><div class="row"><strong>RETRIEVE DESIGN</strong><button id="option-a" class="chosen" onclick="layout('a')">A · Full workspace</button><button id="option-b" onclick="layout('b')">B · Side sheet</button></div><button onclick="theme()">Light / dark</button></div><small id="layout-note">A — Dedicated review and run workspace. Recommended for exact identifiers and diagnostic evidence.</small></div>
<header class="appbar row between"><strong>DimseDash</strong><button id="reveal" class="ghost" onclick="toggleReveal()">Reveal values</button></header>
<div class="frame"><aside class="sidebar"><button class="chosen" onclick="back()">▤ &nbsp; Nodes</button><button onclick="inventory()">▱ &nbsp; Received files</button><button disabled>◷ &nbsp; History</button><button disabled>⚙ &nbsp; Settings</button><div class="receiver"><div><small>LOCAL RECEIVER · SKETCH</small><p>DIMSE_DASH</p><small>Port 11112</small><p class="receiver-status" id="receiver-status">◉ &nbsp; Stopped</p><small id="receiver-note">Prototype only. No socket is opened.</small></div></div></aside><main class="workspace" id="workspace"></main></div>
<dialog id="dialog"><div id="dialog-body"></div><div class="actions"><span></span><button onclick="document.querySelector('#dialog').close()">Close</button></div></dialog>
<script>
'use strict';
const state={layout:'a',view:'review',method:'GET',scope:'series',revealed:false,folder:true,listener:false,edited:false,scenario:'complete',run:null,selected:true};
const scopes={study:{name:'CT chest without contrast',scope:'All instances in this study',level:'STUDY',n:72},series:{name:'Series 2 · Axial lung',scope:'All instances in this series',level:'SERIES',n:24},image:{name:'Instance 12 · Axial lung',scope:'This instance only',level:'IMAGE',n:1}};
const fixtureUids={study:'1.2.826.0.1.3680043.10.543.101',series:'1.2.826.0.1.3680043.10.543.101.2',image:'1.2.826.0.1.3680043.10.543.101.2.12'};
let uids={...fixtureUids};
const $=s=>document.querySelector(s), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sensitive=v=>state.revealed?esc(v):'•••• · masked';
function layout(value){state.layout=value;$('#option-a').classList.toggle('chosen',value==='a');$('#option-b').classList.toggle('chosen',value==='b');$('#layout-note').textContent=value==='a'?'A — Dedicated review and run workspace. Recommended for exact identifiers and diagnostic evidence.':'B — Review beside Query results on wide windows; full-width below 1100 px. Same target and run rules.';render()}
function theme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'}
function toggleReveal(){state.revealed=!state.revealed;$('#reveal').textContent=state.revealed?'Mask values':'Reveal values';render()}
function changeMethod(v){state.method=v;if(v==='GET'&&(state.scenario==='callback'||state.scenario==='destination'))state.scenario='complete';render()}
function changeScope(v){state.scope=v;uids={...fixtureUids};state.edited=false;state.selected=true;render()}
function back(){state.view='query';render();$('#workspace').scrollTop=0}
function review(){state.view='review';render();$('#workspace').scrollTop=0}
function setListener(){state.listener=true;render()}
function folder(){state.folder=!state.folder;render()}
function modal(title,html){$('#dialog-body').innerHTML='<h2>'+esc(title)+'</h2>'+html;$('#dialog').showModal()}
function inventory(){modal('Received files · design sketch','<p>The full receive inventory will live here, independently of run history.</p><p>This comparison shows synthetic receipt records inside the run. It creates no files or durable records.</p>')}
function node(){return `<div class="node"><small>NODES / DEMO ARCHIVE</small><div class="row"><h1>Demo archive</h1><span class="pill blue">Test</span></div><div class="muted">PACS_AET · 192.0.2.10:104 &nbsp; · &nbsp; Calling AE DIMSE_DASH</div></div>`}
function query(compact=false){let t=scopes[state.scope];return `<section class="${compact?'context':''}"><div class="row between"><h2>Query results</h2><span class="pill">C-FIND · synthetic</span></div><div class="card"><small>Executed criteria · sample study query</small><p>${sensitive('Patient ID SYNTH-101')} · CT · 2026-10-01–2026-10-22</p><small>Return to these rows without rerunning. Selecting a parent includes all of its instances.</small></div><div class="card"><div class="row"><button class="ghost" onclick="changeScope('study')">Studies</button><span>›</span><button class="ghost" onclick="changeScope('series')">Series</button><span>›</span><button class="ghost" onclick="changeScope('image')">Instances</button></div><div class="table-scroll"><table><thead><tr><th>${state.scope==='study'?'Study':state.scope==='series'?'Series':'Instance'}</th><th class="wide">Patient / count</th><th>Target</th></tr></thead><tbody><tr class="selected"><td>${sensitive(t.name)}<small>${state.scope==='image'?'CT Image Storage':'CT'}</small></td><td class="wide">${sensitive('DEMO^ALPHA · SYNTH-101')}<small>${t.n} instances · query-reported</small></td><td><button class="chosen" onclick="state.selected=true;render()">✓ Selected</button></td></tr><tr><td class="muted">Other fixture rows</td><td class="wide">Not selected</td><td>—</td></tr></tbody></table></div><p><strong>${t.scope}</strong></p><small>${state.edited?'Review uses edited UIDs; source row label is no longer authoritative.':'One target selected. Inspect and retrieve selection remain separate.'}</small><div class="actions"><button onclick="modal('Query response · synthetic','<p>Read-only query metadata; this is not a received file.</p>')">Inspect</button><button class="primary" onclick="review()">Review retrieve →</button></div></div>${state.run?`<div class="banner">${state.run.active?'Retrieve running':'Latest retrieve'} · ${state.run.method} · synthetic <button onclick="state.view='run';render()">View run</button></div>`:''}</section>`}
function identifier(scope=state.scope,values=uids){const rows=[['(0008,0052)','QueryRetrieveLevel','CS',scopes[scope].level],['(0020,000D)','StudyInstanceUID','UI',values.study]];if(scope!=='study')rows.push(['(0020,000E)','SeriesInstanceUID','UI',values.series]);if(scope==='image')rows.push(['(0008,0018)','SOPInstanceUID','UI',values.image]);return `<div class="table-scroll"><table><thead><tr><th>Tag / keyword</th><th>VR</th><th>Value</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><code>${r[0]}</code><small>${r[1]}</small></td><td>${r[2]}</td><td><code>${i===0?r[3]:sensitive(r[3])}</code></td></tr>`).join('')}</tbody></table></div>`}
function editUids(){if(!state.revealed){modal('Reveal identifiers to edit','<p>Use Reveal values before editing the synthetic identifiers.</p>');return}const fields=['study',...(state.scope!=='study'?['series']:[]),...(state.scope==='image'?['image']:[])];modal('Edit retrieve identifiers · sketch',`<p>Only the required unique identifiers are editable here. Find predicates and return keys are not copied.</p><form id="uid-form" onsubmit="saveUids(event)"><div class="uid-editor">${fields.map(k=>`<label>${k==='image'?'SOP Instance':k==='series'?'Series Instance':'Study Instance'} UID<input name="${k}" value="${esc(uids[k])}" required pattern="[0-9]+(\\.[0-9]+)*" maxlength="64"></label>`).join('')}</div><p class="warn">Saving detaches the source row label. The review will say Edited identifier; it cannot verify a remote match.</p><button class="primary">Use edited identifiers</button></form>`)}
function saveUids(event){event.preventDefault();let data=new FormData(event.target);for(const [k,v] of data)uids[k]=v;state.edited=true;$('#dialog').close();render()}
function readiness(){return `<div class="checks"><div class="check"><b>${state.folder?'✓':'!'}</b><span>${state.folder?'Sample folder selected':'Choose a receive folder'}<small>${state.folder?'Writable check shown as a fixture, not an OS check.':'Required for both methods.'}</small></span></div>${state.method==='GET'?'<div class="check"><b>○</b><span>Separate listener not required<small>Storage roles and contexts are negotiated when the association starts.</small></span></div>':`<div class="check"><b>${state.listener?'✓':'!'}</b><span>${state.listener?'Listening locally · simulated':'Local receiver is stopped'}<small>Remote callback reachability remains unverified.</small></span></div>`}</div>`}
function reviewBody(){let t=scopes[state.scope],busy=state.run?.active;return `<button class="ghost crumb" onclick="back()">← Back to results</button><div class="row between"><h1>Review retrieve</h1><span class="pill">Study Root · ${t.level}</span></div><div class="steps"><strong>1 REVIEW</strong> &nbsp; / &nbsp; 2 RECEIVE &nbsp; / &nbsp; 3 INSPECT</div><section class="card hero"><small>SELECTED TARGET · ${state.edited?'EDITED IDENTIFIER':'FROM QUERY PREVIEW-1'}</small><h2>${state.edited?'Edited identifier · remote match unverified':sensitive(t.name)}</h2><strong>${t.scope}</strong><p class="muted">${state.edited?'The source result label and estimate no longer describe this request.':`${sensitive('DEMO^ALPHA · SYNTH-101')} · ${t.n} instance${t.n===1?'':'s'} reported by query (estimate)`}</p><small>${state.scope==='image'?'This request never expands to the series.':'Includes instances not shown in the current result table. Query filters do not limit this retrieval.'}</small></section><div class="grid"><section class="card"><h2>Transfer method</h2><div class="methods"><button class="method ${state.method==='GET'?'chosen':''}" aria-pressed="${state.method==='GET'}" onclick="changeMethod('GET')"><strong>C-GET</strong><small>Receive on the requesting association. No separate listener.</small></button><button class="method ${state.method==='MOVE'?'chosen':''}" aria-pressed="${state.method==='MOVE'}" onclick="changeMethod('MOVE')"><strong>C-MOVE</strong><small>PACS opens a separate connection to the local receiver.</small></button></div><p class="state-note">Support is unverified until negotiation. No automatic fallback to the other method.</p>${state.method==='MOVE'?`<div class="divider"></div><h3>Local move destination</h3><p><code>DIMSE_DASH</code> · listening port 11112</p><small>The request names the destination AE. Configure its reachable address and port on the PACS.</small><p class="warn">A listening socket does not prove that the PACS can reach it.</p>${!state.listener?'<button onclick="setListener()">Preview receiver started</button>':'<span class="pill good">Listening locally · simulated</span>'}`:'<p class="path mini">DimseDash ⇄ PACS<br>C-GET + C-STORE on one association</p>'}</section><section class="card"><div class="row between"><h2>Receive destination</h2><button class="ghost" onclick="folder()">${state.folder?'Clear sample folder':'Choose sample folder'}</button></div><p class="path">${state.folder?sensitive('DICOM Receives / demo-session'):'No folder selected'}</p><small>Illustrative folder label. The prototype never accesses the filesystem.</small>${readiness()}<div class="divider"></div><small>Saved files survive cancellation and history cleanup. Existing files are not overwritten.</small></section></div><details><summary>Advanced Identifier · required UIDs</summary><div><p>Level is fixed by the selected scope. Return to Query to select another scope.</p>${identifier()}<button class="ghost" onclick="editUids()">Edit identifiers…</button><small>Common UID editor sketch only; complete DICOM validation remains future work.</small></div></details><details><summary>Resolved request · connection and Identifier</summary><div><p>Operation C-${state.method} · model Study Root · node revision 3</p><small>Calling AE DIMSE_DASH · called AE PACS_AET · 192.0.2.10:104</small><small>Timeouts: connect 30s · association 30s · DIMSE 30s · idle 60s</small>${state.method==='MOVE'?'<p>Move Destination (command parameter): DIMSE_DASH</p>':''}${identifier()}<small>Only service-required level and unique keys are sent in this design. Patient-name, date, modality and body-part Find predicates are excluded.</small></div></details><div class="actions"><small>${busy?'A synthetic retrieve is active. Inspect it before creating another sample.':'Production action: Start C-'+state.method+'. This design button only loads a fixed sample state.'}</small><button class="primary" ${!state.folder||(state.method==='MOVE'&&!state.listener)||busy?'disabled':''} onclick="showRun()">Show C-${state.method} sample run →</button></div>${busy?'<button onclick="state.view=\'run\';render()">View active sample</button>':''}${previewControls()}`}
function previewControls(){return `<details class="demo-controls"><summary>Preview controls · fixed synthetic states</summary><div class="row"><label>Selection scope<select aria-label="Selection scope" onchange="changeScope(this.value)">${Object.entries(scopes).map(([k,v])=>`<option value="${k}" ${state.scope===k?'selected':''}>${v.level} · ${k==='image'?'single instance':k}</option>`).join('')}</select></label><label>Sample outcome<select aria-label="Sample outcome" onchange="state.scenario=this.value">${[['complete','Completed'],['progress','Receiving'],['warning','Local save failure'],...(state.method==='MOVE'?[['callback','No callback observed'],['destination','Move destination unknown']]:[]),['cancel','Cancel requested'],['interrupted','Interrupted after restart']].map(([k,v])=>`<option value="${k}" ${state.scenario===k?'selected':''}>${v}</option>`).join('')}</select></label></div><small>Scenarios do not run over time or evaluate readiness, paths or PACS matching.</small></details>`}
function showRun(){if(!state.folder||(state.method==='MOVE'&&!state.listener)||state.run?.active)return;state.run={method:state.method,scope:state.scope,uids:{...uids},edited:state.edited,scenario:state.scenario,active:['progress','cancel'].includes(state.scenario)};state.view='run';render();$('#workspace').scrollTop=0}
function facts(r){let n=scopes[r.scope].n,partial=n===1?0:Math.floor(n/2);switch(r.scenario){case 'progress':return {title:'Receiving · synthetic snapshot',code:'0xFF00 · Pending',peer:[partial,0,0,n-partial],local:[partial,partial,0],note:'Association active in this fixture. Remaining is peer-reported, not derived from Query estimates.',kind:'',width:100*partial/n};case 'warning':return {title:'Completed with local save failure · synthetic',code:'0xB000 · Warning',peer:[n-1,1,0,'Not reported'],local:[n,n-1,1],note:'One received object failed local saving. Successfully saved objects remain available.',kind:'warn',width:null};case 'callback':return {title:'No callback observed · synthetic',code:'Final status not observed',peer:['Unknown','Unknown','Unknown','Unknown'],local:[0,0,0],note:'Request association ended after a local timeout. No inbound storage association was observed in this fixture; the cause is unproven.',kind:'warn',width:null};case 'destination':return {title:'Move destination rejected · synthetic',code:'0xA801 · Move Destination unknown',peer:['Not reported','Not reported','Not reported','Not reported'],local:[0,0,0],note:'Peer reported an unknown destination AE. No objects were saved.',kind:'warn',width:null};case 'cancel':return {title:'Cancellation requested · synthetic',code:'Last response 0xFF00 · Pending',peer:[partial,0,0,n-partial],local:[partial,partial,0],note:'Local C-CANCEL intent is shown. Peer cancellation confirmation has not been observed. Saved files remain.',kind:'warn',width:null};case 'interrupted':return {title:'Interrupted · recovered record sketch',code:'Final status unknown',peer:['Unknown','Unknown','Unknown','Unknown'],local:[partial,partial,0],note:'Recovery-time classification, not a peer response. Existing saved files remain; no automatic retry.',kind:'warn',width:null};default:return {title:'Completed · synthetic',code:'0x0000 · Success',peer:[n,0,0,'Not reported'],local:[n,n,0],note:'Peer success and local saves are shown separately. Successful transfer does not establish diagnostic image quality.',kind:'good',width:null}}}
function stat(label,value){return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`}
function runBody(){let r=state.run,f=facts(r),t=scopes[r.scope],saved=f.local[1];return `<button class="ghost crumb" onclick="back()">← Back to results</button><div class="row between"><h1>Retrieve · C-${r.method}</h1><span class="pill">SYNTHETIC RUN-01</span></div><small>${r.edited?'Edited identifier':sensitive(t.name)} · ${t.scope}</small><div class="status-band ${f.kind}"><h2>${f.title}</h2><strong>${f.code}</strong><p>${f.note}</p>${f.width!==null?`<div class="track" aria-label="Synthetic progress snapshot"><span style="width:${f.width}%"></span></div>`:''}</div><div class="grid"><section class="card"><h3>PEER REPORTED</h3><div class="stat-grid">${['Completed','Failed','Warnings','Remaining'].map((l,i)=>stat(l,f.peer[i])).join('')}</div><small>Latest synthetic DIMSE response. Absent fields are not zero.</small></section><section class="card"><h3>LOCAL · LINKED TO THIS RUN</h3><div class="stat-grid">${['Received','Saved','Save failed'].map((l,i)=>stat(l,f.local[i])).join('')}</div><small>${r.method==='MOVE'?'Correlation must be established from receipt evidence; timing alone is insufficient.':'Storage sub-operations carry direct run context.'}</small></section></div>${r.method==='MOVE'&&r.scenario==='progress'?'<p class="warn">1 additional unlinked delivery is receiver activity, excluded from this run’s received/saved totals.</p>':''}<section class="card"><div class="row between"><h2>Saved objects</h2><span class="pill">${saved} synthetic delivery records</span></div>${saved?`<div class="table-scroll"><table><thead><tr><th>Delivery</th><th>Save / link</th><th>Preview</th></tr></thead><tbody><tr><td>sample-file-001.dcm<small>${sensitive(r.uids.image)}</small></td><td>Saved · ${r.method==='GET'?'direct run context':'correlated'}<small>Acknowledgement: synthetic success<br>Current file availability: sample only</small></td><td><button onclick="inspectFile()">Inspect headers / thumbnail</button></td></tr></tbody></table></div><small>One illustrative row shown; aggregate counts are fixed fixture values.</small>`:'<p class="muted">No successfully saved objects in this fixture.</p>'}</section><details><summary>Run evidence · frozen request</summary><div><p>C-${r.method} · Study Root · ${t.level} · Demo archive revision 3</p><p>Calling AE DIMSE_DASH · destination ${sensitive('DICOM Receives / demo-session')}</p><small>Timeouts: connect 30s · association 30s · DIMSE 30s · idle 60s</small>${r.method==='MOVE'?'<p>Move destination AE DIMSE_DASH · callback uses separate associations</p>':''}${identifier(r.scope,r.uids)}<p>Counts, final status, cancellation intent, transport cleanup and receipt correlation remain distinct evidence.</p></div></details><details><summary>Timeline · sample observations</summary><div><ol class="activity"><li>Request snapshot frozen (synthetic).</li><li>${r.scenario==='destination'?'Peer status 0xA801 illustrated.':r.scenario==='callback'?'No callback observed before local timeout.':'Negotiation and receipt events illustrated by the selected fixture.'}</li><li>${r.active?'Resource cleanup not complete; admission remains occupied.':'Run no longer active. This fixture performs no transport cleanup.'}</li></ol></div></details>${['callback','destination'].includes(r.scenario)?'<details><summary>Suggested checks · not observed facts</summary><div>Check the PACS destination AE registration, configured callback address, routing and receiver policy. The prototype cannot test any of them.</div></details>':''}<div class="actions"><button onclick="back()">Back to Query results</button>${r.active?`<button ${r.scenario==='cancel'?'disabled':''} onclick="state.run.scenario='cancel';render()">Preview cancel request</button>`:`<button class="primary" onclick="review()">Review new retrieve</button>`}</div>${r.active?'<div class="demo-controls"><strong>Preview controls</strong><p>Load a terminal snapshot explicitly; there is no timer or background transfer.</p><button onclick="state.run.scenario=\'complete\';state.run.active=false;render()">Show completion snapshot</button></div>':''}`}
function inspectFile(){modal('Received object · synthetic sketch',`<p>Saved-object inspection is separate from Query metadata inspection.</p><div class="thumb">First-frame grayscale thumbnail placeholder<br><small>No real DICOM pixels, decoding or diagnostic viewer.</small></div><div class="table-scroll"><table><tr><th>Attribute</th><th>Value</th></tr><tr><td>PatientName</td><td>${sensitive('DEMO^ALPHA')}</td></tr><tr><td>PatientID</td><td>${sensitive('SYNTH-101')}</td></tr><tr><td>SOPInstanceUID</td><td>${sensitive(state.run.uids.image)}</td></tr><tr><td>Save outcome</td><td>Synthetic saved record</td></tr></table></div><small>Future states include unsupported codec, non-image object, decode error and missing source. No export in this sketch.</small>`)}
function render(){const target=$('#workspace'),offset=target.scrollTop;$('#receiver-status').textContent=state.listener?'◉ Listening locally · simulated':'◉ Stopped';$('#receiver-note').textContent=state.listener?'Remote reachability unverified. No socket is opened.':'Prototype only. No socket is opened.';let body=state.view==='query'?query():state.view==='run'?runBody():reviewBody();target.innerHTML=node()+`<div class="banner"><strong>Design preview · synthetic data · no network or files</strong><small>Retrieve and receiver controls shown here are proposals, not implemented Flutter capabilities.</small></div>`+(state.layout==='b'&&state.view!=='query'?`<div class="split">${query(true)}<section class="sheet">${body}</section></div>`:body);target.scrollTop=offset}
render();
</script></body></html>
