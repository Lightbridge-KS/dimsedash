name: Dry gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dry:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_COMMAND: flutter
      DART_COMMAND: dart
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-13-dev
      - name: Pinned tools
        run: bash tool/setup_ci.sh
      - name: Locked dependencies
        run: just setup
      - name: Generated source parity
        run: |
          just generate
          git diff --exit-code -- lib/adapters/persistence/database.g.dart
      - name: Dry gate
        run: just dry
